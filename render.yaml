services:
  - type: web
    name: dynamic-portfolio
    runtime: node
    plan: starter
    buildCommand: npm --prefix backend ci && npm --prefix frontend ci && npm --prefix frontend run build
    startCommand: npm --prefix backend start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_FILE
        value: /var/data/portfolio.json
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@portfolio.dev
      - key: ADMIN_PASSWORD
        sync: false
    disk:
      name: portfolio-data
      mountPath: /var/data
      sizeGB: 1
